<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Showroom</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    canvas { display: block; }

    #loading-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: #0a0a0a;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.8s ease;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loader { text-align: center; width: 280px; color: #fff; }
    .loader-bar { width: 100%; height: 2px; background: rgba(255,255,255,0.1); border-radius: 1px; overflow: hidden; }
    .loader-fill { height: 100%; width: 0%; background: #fff; transition: width 0.3s ease; }
    .loader-text { font-size: 0.8rem; opacity: 0.4; margin-top: 1rem; font-weight: 300; }

    #tooltip {
      position: fixed; pointer-events: none; z-index: 50;
      padding: 8px 16px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #fff; font-size: 0.85rem; font-weight: 500;
      opacity: 0; transition: opacity 0.2s ease;
      white-space: nowrap;
    }
    #tooltip .sub { font-size: 0.7rem; font-weight: 300; opacity: 0.5; margin-top: 2px; }
    #tooltip.visible { opacity: 1; }

    #screen-overlay {
      position: fixed; inset: 0; z-index: 60;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #screen-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    #screen-iframe {
      width: 100%; height: 100%;
      border: none;
    }
    .screen-back-btn {
      position: absolute; top: 8px; right: 16px;
      font-size: 0.7rem; color: rgba(255,255,255,0.25);
      letter-spacing: 0.05em; text-transform: uppercase;
      z-index: 70; cursor: pointer;
      padding: 4px 10px;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .screen-back-btn:hover { color: rgba(255,255,255,0.6); }

    #instructions {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 10; color: rgba(255,255,255,0.3);
      font-size: 0.75rem; font-weight: 300; letter-spacing: 0.05em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="loader">
      <div class="loader-bar"><div class="loader-fill"></div></div>
      <p class="loader-text">Loading models...</p>
    </div>
  </div>

  <div id="tooltip"><span class="name"></span><div class="sub">Click to interact</div></div>
  <div id="screen-overlay">
    <iframe id="screen-iframe" src="about:blank"></iframe>
    <div class="screen-back-btn" id="screen-back">ESC to go back</div>
  </div>
  <div id="instructions">Click a model to animate</div>

  <script type="module" src="showroom.js"></script>
</body>
</html>
